<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Rate Test</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/raf-roundel.png?v=3">
  <link rel="shortcut icon" type="image/png" href="../../assets/raf-roundel.png?v=3">
  <link rel="stylesheet" href="../../style.css?v=20261006-6">
  <!-- Pages refresh: timer update deployed from main -->
</head>
<body class="page-quiz">
  <header class="topbar-with-close">
    <a class="topbar-brand" href="../../">
      <img src="../../assets/logo-white.svg" alt="RAF" class="raf-logo">
      <span>RAF DAA Practice</span>
    </a>
    <div class="topbar-actions">
      <a class="about-button" href="../../about.html">What is this website?</a>
      <a class="close-button" href="../../" aria-label="Back to menu">×</a>
    </div>
  </header>

  <main class="work-rate-screen">
    <div class="work-rate-ui">
      <div class="work-rate-header">
        <div class="timer-block">
          <div class="timer-label">Time remaining for this section: <strong id="work-rate-timer">04m 00s</strong></div>
          <div class="progress-track" aria-label="Time remaining">
            <span class="progress-fill"></span>
          </div>
        </div>

        <div class="question-meta" aria-label="Question number">
          <span class="question-word">Question</span>
          <span class="question-number">1</span>
          <span class="question-divider">/</span>
          <span class="question-total">20</span>
        </div>
      </div>

      <div class="work-rate-question">
        <p class="prompt">Which could be the alternative code for</p>
        <h2>Um Eek Ah?</h2>
      </div>

      <div class="code-grid" aria-label="Code pattern grid">
        <div class="code-cell code-letter"><span>Um</span></div>
        <div class="code-cell code-letter"><span>Ta</span></div>
        <div class="code-cell code-letter"><span>Eek</span></div>
        <div class="code-cell code-letter"><span>Ah</span></div>

        <div class="code-cell"><span>£7</span></div>
        <div class="code-cell"><span>£9</span></div>
        <div class="code-cell"><span>£4</span></div>
        <div class="code-cell"><span>£3</span></div>

        <div class="code-cell"><span class="mini-icon">🍓</span></div>
        <div class="code-cell"><span class="mini-icon">🧁</span></div>
        <div class="code-cell"><span class="mini-icon">🍕</span></div>
        <div class="code-cell"><span class="mini-icon">🍏</span></div>
      </div>

      <div class="answer-strip" aria-label="Answer options">
        <div class="answer-group">
          <span class="answer-label">A</span>
          <button class="answer-option" type="button"></button>
        </div>
        <div class="answer-group">
          <span class="answer-label">B</span>
          <button class="answer-option" type="button"></button>
        </div>
        <div class="answer-group">
          <span class="answer-label">C</span>
          <button class="answer-option" type="button"></button>
        </div>
        <div class="answer-group">
          <span class="answer-label">D</span>
          <button class="answer-option" type="button"></button>
        </div>
        <div class="answer-group">
          <span class="answer-label">E</span>
          <button class="answer-option" type="button"></button>
        </div>
      </div>

      <div class="next-button-wrap">
        <button class="back-button" type="button">Back</button>
        <button class="primary-button" type="button">Next</button>
      </div>
    </div>
  </main>

  <script src="./work-rate.js?v=20261006-4"></script>
</body>
</html>
